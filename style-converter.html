        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

                </div>

                <!-- 2. 輸入文字 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">2. 輸入設計主標題與副標</label>
                    <input type="text" id="text-main" value="Hanhan Design Studio" class="w-full rounded-xl bg-slate-900/70 border border-white/20 px-3.5 py-2.5 text-sm text-white mb-2.5 focus:outline-none focus:border-pink-400">

                </div>

                <!-- 3. 選擇轉換風格 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">3. 選擇圖文設計風格</label>
                    <div class="grid grid-cols-2 gap-2.5" id="style-buttons">
                        <button type="button" data-style="cyberpunk" class="style-btn px-3 py-2.5 rounded-xl bg-pink-500/30 border border-pink-400 text-xs font-semibold text-white text-left transition">

                        <button type="button" data-style="pixel" class="style-btn px-3 py-2.5 rounded-xl bg-white/5 hover:bg-white/15 border border-white/15 text-xs font-semibold text-slate-200 text-left transition">

                        </button>
                        <button type="button" data-style="editorial" class="style-btn px-3 py-2.5 rounded-xl bg-white/5 hover:bg-white/15 border border-white/15 text-xs font-semibold text-slate-200 text-left transition">
                            📰 典雅雜誌明體
                        </button>
                        <button type="button" data-style="popart" class="style-btn px-3 py-2.5 rounded-xl bg-white/5 hover:bg-white/15 border border-white/15 text-xs font-semibold text-slate-200 text-left transition">
                            💥 普普藝術漫畫
                        </button>
                        <button type="button" data-style="vintage" class="style-btn px-3 py-2.5 rounded-xl bg-white/5 hover:bg-white/15 border border-white/15 text-xs font-semibold text-slate-200 text-left transition">

                    <span id="current-style-badge" class="px-2.5 py-0.5 rounded-full bg-pink-500/20 text-pink-300 border border-pink-400/30">當前風格：賽博龐克霓虹</span>
                </div>
                
                <div class="w-full rounded-2xl overflow-hidden border border-white/20 shadow-2xl bg-slate-950">

    <!-- 頁尾 -->

    </footer>

    <script>
        const canvas = document.getElementById('design-canvas');
        const ctx = canvas.getContext('2d');
        const uploadInput = document.getElementById('image-upload');
        const mainTextInput = document.getElementById('text-main');
        const subTextInput = document.getElementById('text-sub');
        const fontSizeInput = document.getElementById('font-size');
        const fontSizeLabel = document.getElementById('font-size-label');
        const styleBadge = document.getElementById('current-style-badge');
        const styleButtons = document.querySelectorAll('.style-btn');
        const downloadBtn = document.getElementById('download-btn');

        let currentStyle = 'cyberpunk';
        let uploadedImage = null;

        // 風格設定字典
        const stylesConfig = {
            cyberpunk: {
                label: '賽博龐克霓虹',
                filter: 'contrast(135%) saturate(160%) hue-rotate(-15deg)',
                overlay: 'rgba(15, 23, 42, 0.45)',
                font: '900 {size}px "Orbitron", "Noto Sans TC", sans-serif',
                subFont: '500 26px "Noto Sans TC", sans-serif',
                textColor: '#38bdf8',
                shadowColor: '#ec4899',
                shadowBlur: 25,
                borderColor: '#ec4899'
            },
            pixel: {
                label: '8-Bit 復古像素',
                filter: 'contrast(120%) saturate(130%)',
                overlay: 'rgba(17, 24, 39, 0.4)',
                font: '700 {size}px "DotGothic16", monospace',
                subFont: '400 28px "DotGothic16", monospace',
                textColor: '#fde047',
                shadowColor: '#000000',
                shadowBlur: 0,
                borderColor: '#4ade80'
            },
            editorial: {
                label: '典雅雜誌明體',
                filter: 'grayscale(35%) contrast(110%) brightness(95%)',
                overlay: 'rgba(0, 0, 0, 0.35)',
                font: '900 {size}px "Noto Serif TC", serif',
                subFont: '600 24px "Noto Serif TC", serif',
                textColor: '#ffffff',
                shadowColor: 'rgba(0,0,0,0.6)',
                shadowBlur: 12,
                borderColor: '#e2e8f0'
            },
            popart: {
                label: '普普藝術漫畫',
                filter: 'saturate(240%) contrast(150%)',
                overlay: 'rgba(234, 179, 8, 0.2)',
                font: '400 {size}px "ZCOOL KuaiLe", "Noto Sans TC", sans-serif',
                subFont: '700 26px "Noto Sans TC", sans-serif',
                textColor: '#fef08a',
                shadowColor: '#ef4444',
                shadowBlur: 0,
                borderColor: '#facc15'
            },
            vintage: {
                label: '懷舊底片膠捲',
                filter: 'sepia(65%) contrast(95%) brightness(105%)',
                overlay: 'rgba(69, 26, 3, 0.3)',
                font: '700 {size}px "Noto Serif TC", serif',
                subFont: '400 24px "Noto Sans TC", sans-serif',
                textColor: '#fef3c7',
                shadowColor: 'rgba(69, 26, 3, 0.8)',
                shadowBlur: 10,
                borderColor: '#d97706'
            },
            minimal: {
                label: '日系極簡留白',
                filter: 'brightness(112%) contrast(90%) saturate(80%)',
                overlay: 'rgba(255, 255, 255, 0.25)',
                font: '700 {size}px "Noto Sans TC", sans-serif',
                subFont: '400 24px "Noto Sans TC", sans-serif',
                textColor: '#0f172a',
                shadowColor: 'rgba(255, 255, 255, 0.8)',
                shadowBlur: 8,
                borderColor: '#ffffff'
            }
        };

        // 繪製預設漸層背景（無上傳圖片時）
        function drawDefaultBg() {
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#1b6b77');
            grad.addColorStop(0.5, '#312e81');
            grad.addColorStop(1, '#831843');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function renderCanvas() {
            const cfg = stylesConfig[currentStyle];
            const scaleSize = parseInt(fontSizeInput.value, 10) * 1.8;
            fontSizeLabel.textContent = `${fontSizeInput.value}px`;
            styleBadge.textContent = `當前風格：${cfg.label}`;

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 繪製底圖與濾鏡
            ctx.filter = cfg.filter;
            if (uploadedImage) {
                // 等比例滿版裁切繪製 (Cover)
                const imgRatio = uploadedImage.width / uploadedImage.height;
                const canvasRatio = canvas.width / canvas.height;
                let drawW, drawH, offsetX, offsetY;
                if (imgRatio > canvasRatio) {
                    drawH = canvas.height;
                    drawW = canvas.height * imgRatio;
                    offsetX = (canvas.width - drawW) / 2;
                    offsetY = 0;
                } else {
                    drawW = canvas.width;
                    drawH = canvas.width / imgRatio;
                    offsetX = 0;
                    offsetY = (canvas.height - drawH) / 2;
                }
                ctx.drawImage(uploadedImage, offsetX, offsetY, drawW, drawH);
            } else {
                drawDefaultBg();
            }
            ctx.restore();

            // 2. 風格色調遮罩
            ctx.fillStyle = cfg.overlay;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3. 設計外框裝飾
            ctx.strokeStyle = cfg.borderColor;
            ctx.lineWidth = currentStyle === 'minimal' ? 28 : 6;
            ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

            // 4. 繪製主標題文字
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = cfg.font.replace('{size}', Math.round(scaleSize));
            ctx.fillStyle = cfg.textColor;
            ctx.shadowColor = cfg.shadowColor;
            ctx.shadowBlur = cfg.shadowBlur;

            if (currentStyle === 'pixel' || currentStyle === 'popart') {
                ctx.shadowOffsetX = 6;
                ctx.shadowOffsetY = 6;
            }

            const mainText = mainTextInput.value || 'Hanhan Design';
            ctx.fillText(mainText, canvas.width / 2, canvas.height / 2 - 25);

            // 5. 繪製副標題文字
            ctx.font = cfg.subFont;
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            const subText = subTextInput.value || '';
            ctx.fillText(subText, canvas.width / 2, canvas.height / 2 + scaleSize * 0.85);
            ctx.restore();
        }

        // 上傳圖片監聽
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    renderCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 風格按鈕切換
        styleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                styleButtons.forEach(b => {
                    b.classList.remove('bg-pink-500/30', 'border-pink-400', 'text-white');
                    b.classList.add('bg-white/5', 'border-white/15', 'text-slate-200');
                });
                btn.classList.remove('bg-white/5', 'border-white/15', 'text-slate-200');
                btn.classList.add('bg-pink-500/30', 'border-pink-400', 'text-white');
                currentStyle = btn.dataset.style;
                renderCanvas();
            });
        });

        [mainTextInput, subTextInput, fontSizeInput].forEach(el => {
            el.addEventListener('input', renderCanvas);
        });

        // 下載圖片
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `hanhan-style-${currentStyle}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // 確保字體載入後重繪
        document.fonts.ready.then(renderCanvas);
        renderCanvas();
    </script>
