<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可愛療癒貪食蛇 - 雲端排行榜</title>
    <!-- Tailwind CSS for modern layout utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Press Start 2P for 8-bit retro gaming look -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Custom pixel font and retro styling */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #ffe6f0 0%, #e6f7ff 50%, #fff9e6 100%);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }
        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }
        /* Custom cute box shadow */
        .kawaii-box {
            background: #ffffff;
            border: 4px solid #ffb6c1;
            box-shadow: 6px 6px 0px #ffc0cb, 10px 10px 0px rgba(255, 182, 193, 0.3);
            border-radius: 20px;
        }
        .kawaii-btn {
            background: #ff9ebb;
            border: 3px solid #ff69b4;
            box-shadow: 0px 4px 0px #d85289;
            transition: all 0.1s ease;
        }
        .kawaii-btn:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px #d85289;
        }
        /* Canvas smooth rendering for pixel art */
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* Danger warning pulse animation */
        @keyframes warningPulse {
            0% { border-color: #ffb6c1; box-shadow: 6px 6px 0px #ffc0cb, 10px 10px 0px rgba(255, 182, 193, 0.3); }
            50% { border-color: #ff4d6d; box-shadow: 6px 6px 0px #ff4d6d, 10px 10px 0px rgba(255, 77, 109, 0.5); }
            100% { border-color: #ffb6c1; box-shadow: 6px 6px 0px #ffc0cb, 10px 10px 0px rgba(255, 182, 193, 0.3); }
        }
        .danger-warning {
            animation: warningPulse 0.5s infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 min-h-screen">

    <!-- Top Bar -->
    <header class="w-full max-w-md flex justify-between items-center mb-2 px-2">
        <a href="index.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white/80 hover:bg-white text-pink-500 font-bold rounded-full border-2 border-pink-300 shadow-sm transition transform hover:scale-105 text-sm">
            <span>←</span> 回首頁
        </a>
        <div class="flex gap-3">
            <div class="bg-pink-100 border-2 border-pink-300 px-3 py-1 rounded-full text-xs font-bold text-pink-600 flex items-center gap-1 shadow-sm">
                <span>🌸 分數:</span> <span id="current-score" class="pixel-font text-sm text-pink-700">0</span>
            </div>
            <div class="bg-amber-100 border-2 border-amber-300 px-3 py-1 rounded-full text-xs font-bold text-amber-600 flex items-center gap-1 shadow-sm">
                <span>👑 最高:</span> <span id="high-score" class="pixel-font text-sm text-amber-700">0</span>
            </div>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-md flex flex-col items-center justify-center my-auto">
        <div class="text-center mb-2">
            <h1 class="pixel-font text-xl md:text-2xl text-pink-600 drop-shadow-sm mb-1">✨ 軟萌貪食蛇 ✨</h1>
            <p id="control-hint" class="text-xs text-pink-400 font-medium">使用 上下左右鍵控制方向，空白鍵暫停/開始</p>
            <!-- 靠近牆壁或自己時的動態提示文字 -->
            <div id="danger-alert" class="h-5 mt-1 text-xs font-bold text-rose-500 transition-opacity duration-200 opacity-0">
                ⚠️ 小心！前方快撞到了！
            </div>
        </div>

        <div id="game-box" class="relative kawaii-box p-3 bg-white/90 backdrop-blur-sm transition-all duration-300">
            <!-- Game Canvas -->
            <canvas id="gameCanvas" class="w-full aspect-square bg-[#fffef0] rounded-xl border-2 border-pink-200 block" width="400" height="400"></canvas>

            <!-- Overlay for Start / Pause / Game Over / Leaderboard -->
            <div id="overlay" class="absolute inset-0 bg-pink-900/30 backdrop-blur-xs flex flex-col items-center justify-center rounded-2xl transition-opacity duration-300 overflow-y-auto p-4 z-10">
                <div id="overlay-card" class="bg-white/95 p-5 rounded-2xl border-4 border-pink-300 shadow-xl text-center w-full max-w-[90%] my-auto">
                    <h2 id="overlay-title" class="pixel-font text-base text-pink-600 mb-2">準備出發！</h2>
                    <p id="overlay-desc" class="text-xs text-gray-600 mb-4 leading-relaxed">點擊下方按鈕或按下空白鍵開始遊戲吧～</p>
                    
                    <!-- 遊戲開始按鈕 -->
                    <button id="overlay-btn" type="button" class="kawaii-btn text-white font-bold px-6 py-2.5 rounded-xl pixel-font text-xs shadow-md mb-3 w-full cursor-pointer hover:brightness-105 active:scale-95 transition">
                        開始遊戲
                    </button>

                    <!-- 遊戲結束後的上傳分數區塊（預設隱藏） -->
                    <div id="score-submit-section" class="hidden mb-3 text-left">
                        <label class="block text-xs font-bold text-pink-600 mb-1">輸入你的遊戲 ID 暱稱：</label>
                        <div class="flex gap-2">
                            <input type="text" id="player-name" maxlength="12" placeholder="例如：貪吃小可愛" class="flex-1 border-2 border-pink-300 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-pink-500">
                            <button id="submit-score-btn" type="button" class="bg-pink-500 hover:bg-pink-600 text-white font-bold px-4 py-1.5 rounded-lg text-xs shadow transition">
                                登記分數
                            </button>
                        </div>
                    </div>

                    <!-- 雲端排行榜區塊 -->
                    <div class="mt-2 border-t-2 border-pink-100 pt-2">
                        <h3 class="pixel-font text-xs text-amber-600 mb-2">🏆 雲端前 10 名排行榜 🏆</h3>
                        <div id="leaderboard-list" class="max-h-32 overflow-y-auto text-xs text-gray-700 bg-pink-50/50 rounded-lg p-2 border border-pink-200">
                            <p class="text-gray-400 text-center py-2">載入排行榜中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Touch Controls (含上下左右) -->
    <footer class="w-full max-w-md mt-3 flex flex-col items-center">
        <div class="grid grid-cols-3 gap-2 w-full px-2">
            <!-- 第一行：上 -->
            <div></div>
            <button id="btn-up" type="button" class="kawaii-btn text-white font-bold py-3 rounded-2xl flex items-center justify-center text-lg shadow-md active:scale-95">
                ▲ 上
            </button>
            <div></div>
            
            <!-- 第二行：左、暫停、右 -->
            <button id="btn-left" type="button" class="kawaii-btn text-white font-bold py-3 rounded-2xl flex items-center justify-center text-lg shadow-md active:scale-95">
                ◀ 左
            </button>
            <button id="btn-pause" type="button" class="bg-amber-400 border-3 border-amber-500 shadow-[0_4px_0_#b48100] text-white font-bold py-3 rounded-2xl flex items-center justify-center text-xs pixel-font active:scale-95">
                暫停
            </button>
            <button id="btn-right" type="button" class="kawaii-btn text-white font-bold py-3 rounded-2xl flex items-center justify-center text-lg shadow-md active:scale-95">
                右 ▶
            </button>

            <!-- 第三行：下 -->
            <div></div>
            <button id="btn-down" type="button" class="kawaii-btn text-white font-bold py-3 rounded-2xl flex items-center justify-center text-lg shadow-md active:scale-95">
                ▼ 下
            </button>
            <div></div>
        </div>
    </footer>

    <script>
        // Google Apps Script Web App URL
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyqitUX100l1A1wrokQXiydI6rqCs-tOyk1D5jrRELPwqlqRa75DqboY_cIyXLO2aqmpg/exec';

        // Game Constants & Variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GRID_SIZE = 20; // 20x20 grid
        const TILE_SIZE = canvas.width / GRID_SIZE;

        let snake = [];
        let food = { x: 0, y: 0, type: 'strawberry' };
        let direction = 'RIGHT'; // 'UP', 'DOWN', 'LEFT', 'RIGHT'
        let nextDirection = 'RIGHT';
        let score = 0;
        let highScore = localStorage.getItem('kawaii_snake_highscore') || 0;
        let gameInterval = null;
        let gameSpeed = 130; // ms per frame
        let gameState = 'START'; // 'START', 'PLAYING', 'PAUSED', 'GAMEOVER'

        // DOM elements
        const currentScoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const overlayBtn = document.getElementById('overlay-btn');
        const scoreSubmitSection = document.getElementById('score-submit-section');
        const playerNameInput = document.getElementById('player-name');
        const submitScoreBtn = document.getElementById('submit-score-btn');
        const leaderboardList = document.getElementById('leaderboard-list');
        const dangerAlert = document.getElementById('danger-alert');
        const gameBox = document.getElementById('game-box');

        highScoreEl.textContent = highScore;

        // 載入雲端排行榜（取前 10 名，顯示玩家填寫的遊戲 ID 暱稱）
        async function fetchLeaderboard() {
            leaderboardList.innerHTML = '<p class="text-gray-400 text-center py-2">載入排行榜中...</p>';
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const result = await response.json();
                if (result.status === 'success' && result.data) {
                    renderLeaderboard(result.data);
                } else {
                    leaderboardList.innerHTML = '<p class="text-red-400 text-center py-2">暫無排行榜資料</p>';
                }
            } catch (err) {
                console.error("讀取排行榜失敗", err);
                leaderboardList.innerHTML = '<p class="text-red-400 text-center py-2">無法連線至雲端排行榜</p>';
            }
        }

        // 渲染排行榜列表（限制顯示前 10 名）
        function renderLeaderboard(data) {
            if (!data || data.length === 0) {
                leaderboardList.innerHTML = '<p class="text-gray-400 text-center py-2">還沒有人上榜，快來搶頭香！</p>';
                return;
            }

            // 取前 10 名
            const top10 = data.slice(0, 10);

            let html = '<table class="w-full text-left border-collapse">';
            html += '<tr class="border-b border-pink-200 text-pink-600 font-bold"><th class="py-1 px-1">#</th><th class="py-1 px-1">遊戲ID / 暱稱</th><th class="py-1 px-1 text-right">分數</th></tr>';
            
            top10.forEach((item, index) => {
                html += `<tr class="border-b border-pink-100/50 hover:bg-pink
