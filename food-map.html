        }

            background-color: #0f172a;
            background-image: 
                radial-gradient(at 10% 20%, rgba(56, 189, 248, 0.3) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(168, 85, 247, 0.25) 0px, transparent 50%),

<body class="bg-mesh text-slate-100 min-h-screen selection:bg-pink-500 selection:text-white">

    <!-- 導覽列 -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-nav">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xl font-bold tracking-wider bg-gradient-to-r from-sky-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">
                    Hanhan Chen
                </a>
                <span class="text-slate-500">/</span>
                <span class="text-sm font-medium text-sky-300">世界美食地圖</span>
            </div>
            
            <!-- 回首頁連結 -->
            <a href="index.html" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 text-sm font-medium transition-all flex items-center gap-2 shadow-sm">
                <span>🏠</span> 回首頁
            </a>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="pt-28 pb-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto space-y-8">
        
        <!-- 標題與介紹 -->
        <div class="text-center max-w-3xl mx-auto space-y-3">
            <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full glass-card text-xs text-sky-300 border border-sky-400/30">
                🌍 全球美食探索 × 智慧預算計算
            </div>
            <h1 class="text-3xl sm:text-4xl font-bold bg-gradient-to-r from-sky-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">
                世界美食地圖
            </h1>
            <p class="text-slate-300 text-sm sm:text-base">
                查詢各國餐廳與道地路邊攤、即時營業狀態、距離測算，還能依你的單餐預算精準推薦好料！
            </p>
        </div>

        <!-- 篩選與預算計算控制台 -->
        <section class="glass-card rounded-3xl p-6 sm:p-8 space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- 國家/地區 -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">🌐 國家 / 地區</label>
                    <select id="filter-country" class="w-full rounded-xl bg-slate-900/70 border border-white/20 px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400">
                        <option value="all">全部國家地區</option>
                        <option value="台灣">台灣 (台北 / 台南)</option>
                        <option value="日本">日本 (東京 / 大阪)</option>
                        <option value="韓國">韓國 (首爾)</option>
                        <option value="泰國">泰國 (曼谷)</option>
                        <option value="義大利">義大利 (羅馬)</option>
                    </select>
                </div>

                <!-- 菜系與類型 -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">🍜 想吃哪種菜系 / 類型</label>
                    <select id="filter-cuisine" class="w-full rounded-xl bg-slate-900/70 border border-white/20 px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400">
                        <option value="all">全部菜系與類型</option>
                        <option value="路邊攤小吃">路邊攤 / 夜市小吃</option>
                        <option value="日式料理">日式拉麵 / 壽司</option>
                        <option value="韓式料理">韓式烤肉 / 街頭美食</option>
                        <option value="泰式料理">泰式酸辣 / 船麵</option>
                        <option value="義式餐館">義式披薩 / 義大利麵</option>
                    </select>
                </div>

                <!-- 一餐預算計算機 -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">💰 我這餐的預算 (TWD 台幣)</label>
                    <div class="relative">
                        <input type="number" id="filter-budget" placeholder="例如：300 (留空不限)" min="0" step="50" class="w-full rounded-xl bg-slate-900/70 border border-white/20 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-pink-400">
                    </div>
                </div>

                <!-- 營業與距離排序 -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">📍 排序與狀態</label>
                    <select id="filter-sort" class="w-full rounded-xl bg-slate-900/70 border border-white/20 px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400">
                        <option value="distance">推薦附近美食 (距離由近到遠)</option>
                        <option value="open">僅顯示「目前營業中」</option>
                        <option value="price-asc">價格由低到高</option>
                    </select>
                </div>
            </div>

            <!-- 預算計算提示列 -->
            <div id="budget-summary" class="flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-white/10 text-xs sm:text-sm text-slate-300">
                <span id="result-count">正在載入全球美食資料庫...</span>
                <button id="reset-btn" type="button" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs transition">
                    重置篩選條件
                </button>
            </div>
        </section>

        <!-- 美食餐廳卡片列表 -->
        <section id="food-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 由 JS 動態生成卡片 -->
        </section>

    </main>

    <!-- 頁尾 -->
    <footer class="glass-nav py-8 px-4 text-center text-xs text-slate-400">
        <p>&copy; 2026 陳莙涵 Hanhan Chen. All rights reserved. | <a href="index.html" class="text-sky-400 hover:underline">返回作品集首頁</a></p>
    </footer>

    <script>
        // 模擬世界美食資料庫
        const foodData = [
            {
                name: "阿宗麵線 & 饒河胡椒餅攤",
                country: "台灣",
                city: "台北市・松山區",
                type: "路邊攤小吃",
                cuisine: "路邊攤小吃",
                price: 95,
                distanceKm: 0.4,
                isOpen: true,
                hours: "16:00 - 23:30",
                rating: 4.8,
                emoji: "🥟",
                gradient: "from-amber-500/30 to-orange-600/30",
                review: "炭火現烤胡椒餅外皮酥脆，蔥肉內餡爆汁！路邊攤價格親民，逛夜市必吃首選。"
            },
            {
                name: "一蘭拉麵 澀谷店",
                country: "日本",
                city: "東京・澀谷區",
                type: "特色餐館",
                cuisine: "日式料理",
                price: 260,
                distanceKm: 1.2,
                isOpen: true,
                hours: "24 小時營業",
                rating: 4.7,
                emoji: "🍜",
                gradient: "from-rose-500/30 to-red-600/30",
                review: "濃郁天然豚骨湯頭搭配特製赤紅秘製醬汁，深夜也能隨時吃到的溫暖美味。"
            },
            {
                name: "廣藏市場 麻藥紫菜飯捲攤",
                country: "韓國",
                city: "首爾・鐘路區",
                type: "路邊攤小吃",
                cuisine: "韓式料理",
                price: 120,
                distanceKm: 2.5,
                isOpen: true,
                hours: "09:00 - 21:00",
                rating: 4.6,
                emoji: "🍙",
                gradient: "from-emerald-500/30 to-teal-600/30",
                review: "沾上特製黃芥末醬油讓人一口接一口停不下來，旁邊還有熱騰騰的魚板湯！"
            },
            {
                name: "勝利紀念碑 傳統船麵館",
                country: "泰國",
                city: "曼谷・拉差貼威",
                type: "在地餐館",
                cuisine: "泰式料理",
                price: 80,
                distanceKm: 0.9,
                isOpen: false,
                hours: "10:00 - 18:00 (已打烊)",
                rating: 4.9,
                emoji: "🍲",
                gradient: "from-purple-500/30 to-pink-600/30",
                review: "小碗裝只要銅板價，湯頭酸辣帶勁，一次疊十碗超過癮，建議中午時段前往。"
            },
            {
                name: "Trattoria Da Enzo 羅馬小館",
                country: "義大利",
                city: "羅馬・特拉斯提弗列",
                type: "經典餐廳",
                cuisine: "義式餐館",
                price: 680,
                distanceKm: 3.8,
                isOpen: true,
                hours: "12:00 - 15:00, 19:00 - 23:00",
                rating: 4.9,
                emoji: "🍝",
                gradient: "from-sky-500/30 to-indigo-600/30",
                review: "最正宗的培根蛋黃麵 Carbonara，起司與黑胡椒香氣濃郁，氛圍極佳的家庭餐館。"
            },
            {
                name: "築地場外市場 海鮮蓋飯屋",
                country: "日本",
                city: "東京・中央區",
                type: "特色餐館",
                cuisine: "日式料理",
                price: 520,
                distanceKm: 1.8,
                isOpen: false,
                hours: "06:00 - 14:30 (已打烊)",
                rating: 4.8,
                emoji: "🍣",
                gradient: "from-cyan-500/30 to-blue-600/30",
                review: "每日清晨直送海膽、鮭魚卵與黑鮪魚大腹，鮮甜度滿分，早起排隊非常值得。"
            }
        ];

        const countryEl = document.getElementById('filter-country');
        const cuisineEl = document.getElementById('filter-cuisine');
        const budgetEl = document.getElementById('filter-budget');
        const sortEl = document.getElementById('filter-sort');
        const gridEl = document.getElementById('food-grid');
        const countEl = document.getElementById('result-count');
        const resetBtn = document.getElementById('reset-btn');

        function renderFood() {
            const country = countryEl.value;
            const cuisine = cuisineEl.value;
            const budget = budgetEl.value ? parseFloat(budgetEl.value) : Infinity;
            const sort = sortEl.value;

            let filtered = foodData.filter(item => {
                const matchCountry = country === 'all' || item.country === country;
                const matchCuisine = cuisine === 'all' || item.cuisine === cuisine;
                const matchBudget = item.price <= budget;
                const matchOpen = sort === 'open' ? item.isOpen : true;
                return matchCountry && matchCuisine && matchBudget && matchOpen;
            });

            if (sort === 'distance') {
                filtered.sort((a, b) => a.distanceKm - b.distanceKm);
            } else if (sort === 'price-asc') {
                filtered.sort((a, b) => a.price - b.price);
            }

            // 更新預算提示文字
            if (budget !== Infinity) {
                countEl.innerHTML = `以單餐預算 <strong class="text-pink-300">NT$ ${budget}</strong> 計算，共為你找到 <strong class="text-sky-300">${filtered.length}</strong> 間可負擔的美食！`;
            } else {
                countEl.innerHTML = `共顯示 <strong class="text-sky-300">${filtered.length}</strong> 間全球精選餐廳與路邊攤`;
            }

            if (filtered.length === 0) {
                gridEl.innerHTML = `
                    <div class="col-span-full glass-card rounded-2xl p-10 text-center space-y-2">
                        <p class="text-lg font-semibold text-slate-200">找不到符合條件的美食 😢</p>
                        <p class="text-sm text-slate-400">試著提高單餐預算或切換其他國家與菜系看看吧！</p>
                    </div>`;
                return;
            }

            gridEl.innerHTML = filtered.map(item => `
                <article class="glass-card rounded-2xl overflow-hidden flex flex-col justify-between transition-all hover:-translate-y-1 hover:border-sky-400/50">
                    <div>
                        <!-- 食物圖文視覺區 -->
                        <div class="h-36 bg-gradient-to-br ${item.gradient} flex items-center justify-between px-6 relative border-b border-white/10">
                            <span class="text-6xl drop-shadow-lg">${item.emoji}</span>
                            <div class="text-right space-y-1.5">
                                <span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold ${item.isOpen ? 'bg-emerald-500/30 text-emerald-200 border border-emerald-400/40' : 'bg-rose-500/30 text-rose-200 border border-rose-400/40'}">
                                    ${item.isOpen ? '🟢 營業中' : '🔴 休息中'}
                                </span>
                                <div class="text-xs text-slate-200 font-medium bg-slate-900/50 px-2.5 py-1 rounded-lg">
                                    📍 距離 ${item.distanceKm} km
                                </div>
                            </div>
                        </div>

                        <!-- 餐廳資訊 -->
                        <div class="p-5 space-y-3">
                            <div class="flex items-start justify-between gap-2">
                                <div>
                                    <span class="text-[11px] text-sky-300 font-medium">${item.country} · ${item.city} · ${item.type}</span>
                                    <h3 class="text-lg font-bold text-white mt-0.5">${item.name}</h3>
                                </div>
                                <span class="text-xs font-bold text-amber-300 bg-amber-500/20 px-2 py-1 rounded-lg border border-amber-400/30">
                                    ★ ${item.rating}
                                </span>
                            </div>

                            <p class="text-xs text-slate-300 leading-relaxed bg-white/5 p-3 rounded-xl border border-white/10">
                                💬 「${item.review}」
                            </p>
                        </div>
                    </div>

                    <!-- 底部時間與價格 -->
                    <div class="px-5 py-3.5 bg-slate-950/30 border-t border-white/10 flex items-center justify-between text-xs">
                        <span class="text-slate-400">🕒 ${item.hours}</span>
                        <span class="font-bold text-pink-300 text-sm">均消 NT$ ${item.price}</span>
                    </div>
                </article>
            `).join('');
        }

        [countryEl, cuisineEl, budgetEl, sortEl].forEach(el => el.addEventListener('input', renderFood));
        resetBtn.addEventListener('click', () => {
            countryEl.value = 'all';
            cuisineEl.value = 'all';
            budgetEl.value = '';
            sortEl.value = 'distance';
            renderFood();
        });

        renderFood();
    </script>
</body>
</html>
