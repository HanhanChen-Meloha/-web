name: Update Google Alerts News

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0:00 執行（即台灣時間早上 8 點）
  workflow_dispatch:     # 允許手動觸發

permissions:
  contents: write        # 授權 Workflow 自動寫入檔案並推送到倉庫

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser

      - name: Fetch RSS feeds and generate news.json
        run: |
          python -c '
          import feedparser
          import json
          import html

          # 你提供的三個 Google 快訊 RSS 網址
          feed_urls = [
              "https://www.google.com/alerts/feeds/15211736244049125268/4535768643829414521",
              "https://www.google.com/alerts/feeds/15211736244049125268/12758307388503619950",
              "https://www.google.com/alerts/feeds/15211736244049125268/14647605136052552607"
          ]

          all_entries = []

          for url in feed_urls:
              parsed = feedparser.parse(url)
              for entry in parsed.entries:
                  # 清理標題與摘要中的 HTML 標籤
                  title = html.unescape(entry.get("title", ""))
                  link = entry.get("link", "#")
                  published = entry.get("published", entry.get("updated", ""))
                  
                  all_entries.append({
                      "title": title,
                      "link": link,
                      "published": published
                  })

          # 依照發布時間排序（若有時間欄位），並取前 10 筆最新的
          all_entries.sort(key=lambda x: x["published"], reverse=True)
          latest_news = all_entries[:10]

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(latest_news, f, ensure_ascii=False, indent=2)
          print(f"Successfully generated news.json with {len(latest_news)} items.")
          '

      - name: Commit and push news.json if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update news.json" && git push)
